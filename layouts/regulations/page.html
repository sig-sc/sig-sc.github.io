{{ define "main" }}

<div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-16">
  <header>
    <h1 class="text-4xl font-bold text-gray-900 dark:text-slate-100">{{ .Title }}</h1>
    <p class="mt-3 text-gray-500 dark:text-slate-400 text-sm">{{ .Description }}</p>
  </header>

  <!-- ── 選奨規程 ───────────────────────────────────────────── -->
  <section>
    <h2 class="section-heading">選奨規程</h2>
    <div class="card prose prose-sm dark:prose-invert max-w-none prose-p:text-gray-700 dark:prose-p:text-slate-300 prose-p:leading-relaxed prose-strong:text-gray-900 dark:prose-strong:text-slate-100">
      {{ .Content }}
    </div>
  </section>

  <!-- ── 論文誌への推薦 ─────────────────────────────────────── -->
  <section>
    <h2 class="section-heading">IEICE論文誌への推薦論文制度</h2>
    <div class="card prose prose-sm dark:prose-invert max-w-none prose-p:text-gray-700 dark:prose-p:text-slate-300 prose-p:leading-relaxed prose-strong:text-gray-900 dark:prose-strong:text-slate-100">
      <p>サービスコンピューティング研究会では、研究会で発表された論文のうち特に優秀なものを、専門委員会の選考に基づき、電子情報通信学会論文誌へ「推薦論文」として推薦します。</p>
    </div>
  </section>
</div>
{{ end }}

name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches:
      - master
      - ikegawa-patch
  # PR ではビルド検証のみ実行（デプロイは master のみ）
  pull_request:
    branches:
      - master
  # 手動実行
  workflow_dispatch:
  # 毎週月曜 JST 6:00 (UTC 日曜 21:00) に自動実行
  schedule:
    - cron: "0 21 * * 0"

# GitHub Pages デプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 並行デプロイを防ぐ（進行中のデプロイをキャンセルしない）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Hugo の .GitInfo と lastmod に必要

      # ツールバージョンは .devcontainer/devcontainer.json を単一の情報源とする
      - name: Read tool versions from devcontainer
        id: versions
        run: |
          {
            echo "hugo=$(jq -r '.features["ghcr.io/devcontainers/features/hugo:1"].version' .devcontainer/devcontainer.json)"
            echo "node=$(jq -r '.image | capture("node:(?<v>[0-9]+)").v' .devcontainer/devcontainer.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.versions.outputs.hugo }}
          extended: true

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          TZ: Asia/Tokyo
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ikegawa-patch'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

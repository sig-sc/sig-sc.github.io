baseURL = "https://sig-sc.org/"
locale = "ja-JP"
defaultContentLanguage = "ja"
title = "サービスコンピューティング研究会"

# タグ・カテゴリページは使用していないため生成しない
disableKinds = ["taxonomy", "term"]

[params]
  description = "電子情報通信学会 サービスコンピューティング研究会 (IEICE SIG-SC)"
  author = "IEICE SIG-SC"

[permalinks]
  posts = "/posts/:year/:month/:day/:slug/"

[pagination]
  pagerSize = 20

# Hugo 0.165以降、Tailwind CLIの実行に明示的な許可が必要
[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github"
